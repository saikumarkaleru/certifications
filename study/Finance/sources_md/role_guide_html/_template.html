<!DOCTYPE html>
<!--
  SHARED STUDY-GUIDE TEMPLATE — do not change the <style> block.
  Each subject guide must reuse this exact <head> so all PDFs look consistent.
  Fill <body> with the guide content using the classes documented below.

  STRUCTURE TO USE INSIDE <body>:
    <div class="cover">                              (title page)
      <div class="cover-kicker">INTERVIEW PREP · FINANCE ROLES</div>
      <h1 class="cover-title">Subject Name</h1>
      <div class="cover-sub">One-line scope. Roles: ...</div>
    </div>
    <div class="toc">...contents list...</div>       (optional)
    <h2>1. Section</h2>            (major section, starts near top; use page-break as needed)
    <h3>1.1 Subsection</h3>
    <p>...</p>
    <ul><li>...</li></ul>
    <div class="formula"><b>Name</b><br> equation <div class="where">where: ...</div></div>
    <table><thead><tr><th>..</th></tr></thead><tbody><tr><td>..</td></tr></tbody></table>
    <div class="example"><div class="ex-h">Worked Example</div> ...steps... </div>
    <div class="qa"><div class="q">Q: ...</div><div class="a">A: ...</div></div>
    <div class="trap"><b>Common trap:</b> ...</div>
    <div class="keytake"><b>Key takeaways:</b> ...</div>
-->
<html lang="en"><head><meta charset="UTF-8"><style>
  @page { size: A4; margin: 16mm 16mm 16mm 16mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Georgia","Cambria",serif; font-size: 10.5pt; line-height: 1.5; color: #1a1a1a; }
  h1,h2,h3,.cover-kicker,.cover-sub,.ex-h,.q,th { font-family: "Calibri","Segoe UI",sans-serif; }

  /* Cover */
  .cover { height: 250mm; display: flex; flex-direction: column; justify-content: center; page-break-after: always; }
  .cover-kicker { font-size: 11pt; font-weight: 700; letter-spacing: 2px; color: #1f4e79; text-transform: uppercase; }
  .cover-title { font-size: 34pt; font-weight: 800; color: #16365c; margin: 10px 0 6px; line-height: 1.1; }
  .cover-sub { font-size: 12pt; color: #444; font-style: italic; }
  .cover-foot { margin-top: 22px; font-size: 10pt; color: #666; font-family:"Calibri",sans-serif; }

  /* TOC */
  .toc { page-break-after: always; }
  .toc h2 { border: none; }
  .toc ol { margin-left: 20px; font-family:"Calibri",sans-serif; font-size: 11pt; line-height: 1.9; }

  /* Headings */
  h2 { font-size: 16pt; font-weight: 700; color: #16365c; border-bottom: 2px solid #16365c;
       padding-bottom: 4px; margin: 18px 0 10px; page-break-after: avoid; }
  h3 { font-size: 12.5pt; font-weight: 700; color: #1f4e79; margin: 14px 0 5px; page-break-after: avoid; }
  h4 { font-size: 11pt; font-weight: 700; color: #333; margin: 10px 0 4px; font-family:"Calibri",sans-serif; }
  p { margin: 5px 0; text-align: justify; }
  ul, ol { margin: 5px 0 5px 22px; }
  li { margin-bottom: 3px; }
  b, strong { color: #16365c; }

  /* Formula box */
  .formula { background: #f4f7fb; border-left: 4px solid #1f4e79; padding: 8px 12px; margin: 8px 0;
             font-family: "Cambria Math","Cambria",serif; page-break-inside: avoid; }
  .formula b { color: #16365c; }
  .formula .where { font-size: 9.3pt; color: #555; margin-top: 3px; font-family:"Calibri",sans-serif; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; margin: 9px 0; font-size: 9.6pt; page-break-inside: avoid; }
  th { background: #16365c; color: #fff; text-align: left; padding: 5px 8px; font-size: 9.6pt; }
  td { border: 1px solid #cbd5e1; padding: 4px 8px; vertical-align: top; }
  tbody tr:nth-child(even) { background: #f4f7fb; }

  /* Worked example */
  .example { border: 1px solid #b7c7dd; border-radius: 4px; padding: 9px 12px; margin: 10px 0;
             background: #fbfdff; page-break-inside: avoid; }
  .ex-h { font-weight: 700; color: #1f4e79; font-size: 10.5pt; margin-bottom: 4px; }

  /* Q&A */
  .qa { margin: 8px 0; page-break-inside: avoid; }
  .qa .q { font-weight: 700; color: #16365c; }
  .qa .a { margin-top: 2px; }

  /* Trap / takeaway callouts */
  .trap { background: #fff6f0; border-left: 4px solid #c26a2c; padding: 6px 11px; margin: 8px 0; font-size: 10pt; }
  .keytake { background: #f0f7f1; border-left: 4px solid #3f7d45; padding: 8px 12px; margin: 12px 0; }

  .sec { page-break-before: always; }   /* put on an <h2> to force a fresh page */
</style></head><body>

  <!-- CONTENT GOES HERE -->

</body></html>
