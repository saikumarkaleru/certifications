# Secret for sensitive config. In real life, DO NOT commit real values — use a
# sealed-secret / external-secrets operator / cloud secret manager. stringData
# lets you write plaintext that k8s base64-encodes for you.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  labels:
    app.kubernetes.io/part-of: resilient-ecommerce
type: Opaque
stringData:
  # Used by user-service to sign auth tokens.
  SECRET_KEY: "replace-me-in-prod-with-a-long-random-value"
