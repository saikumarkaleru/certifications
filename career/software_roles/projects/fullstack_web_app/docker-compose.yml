services:
  backend:
    build: ./backend
    container_name: task-tracker-backend
    ports:
      - "8000:8000"
    environment:
      # Allow the containerized frontend (served on :3000) plus local dev origins.
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
      - DATABASE_URL=sqlite:///./tasks.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser talks to the backend on the host-published port.
        VITE_API_URL: http://localhost:8000
    container_name: task-tracker-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
